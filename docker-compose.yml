version: '3.8'
services:
  neo4j:
    image: neo4j:latest
    container_name: tcc-graph-db
    ports:
      - "7474:7474" 
      - "7687:7687"
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tcc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: tcc-crawler
    restart: unless-stopped
    depends_on:
      - rabbitmq
    env_file:
      - .env
    volumes:
      - ./crawler/output_pdfs:/app/output_pdfs