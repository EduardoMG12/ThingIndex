services:
  neo4j:
    image: neo4j:latest
    container_name: tcc-graph-db
    ports:
      - "7474:7474" 
      - "7687:7687"
    # env_file:
    #   - .env
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=${NEO4J_PLUGINS}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tcc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    container_name: tcc-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    container_name: tcc-crawler
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env
    environment:
      STORAGE_TYPE: "minio"
      RABBITMQ_URL: ${RABBITMQ_URL}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      TELEMETRY_EXCHANGE: ${TELEMETRY_EXCHANGE:-pipeline_telemetry}

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tcc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
    env_file:
      - .env
    environment:
      TELEMETRY_EXCHANGE: ${TELEMETRY_EXCHANGE:-pipeline_telemetry}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_AUTH: ${NEO4J_AUTH}

  legal-parser:
    build:
      context: .
      dockerfile: legal-parser/Dockerfile
    container_name: tcc-legal-parser
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      PARSER_INPUT_QUEUE: "raw_documents"
      PARSER_OUTPUT_QUEUE: "parsed_documents"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      TELEMETRY_EXCHANGE: ${TELEMETRY_EXCHANGE:-pipeline_telemetry}
    volumes:
      - ./legal-parser/parsed_data:/app/parsed_data

  populator:
    build:
      context: .
      dockerfile: populator/Dockerfile
    container_name: tcc-populator
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - minio
      - neo4j
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      POPULATOR_QUEUE: "parsed_documents"
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_AUTH: ${NEO4J_AUTH}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      TELEMETRY_EXCHANGE: ${TELEMETRY_EXCHANGE:-pipeline_telemetry}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tcc-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

volumes:
  minio_data:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:
  frontend_node_modules:
