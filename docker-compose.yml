services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: tcc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  minio:
    image: minio/minio
    container_name: tcc-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tcc-api
    restart: unless-stopped
    ports:
      - "8000:8080"
    depends_on:
      - rabbitmq
      - db
    env_file:
      - .env
    environment:
      TELEMETRY_EXCHANGE: ${TELEMETRY_EXCHANGE:-pipeline_telemetry}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_AUTH: ${NEO4J_AUTH}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tcc-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_INTERNAL_URL=${API_INTERNAL_URL}

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  minio_data:
  rabbitmq_data:
  frontend_node_modules:
  pgdata:
