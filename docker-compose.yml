services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio:
    # A MinIO parou de publicar imagem no Docker Hub e no quay.io (o pull de
    # minio/minio passou a dar "access denied" em 2026-09). A Chainguard
    # continua compilando o mesmo binario a partir do codigo-fonte. Ela nao traz
    # curl, entao o healthcheck fala HTTP direto pelo /dev/tcp do bash.
    image: cgr.dev/chainguard/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r l <&3 && [[ $$l == *" 200"* ]]'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gcs-emulator:
    image: fsouza/fake-gcs-server:1.53.1
    # -public-host e obrigatorio: sem ele o emulador monta as URLs de download
    # contra storage.googleapis.com, entao Attrs funciona mas NewReader devolve
    # "object doesn't exist" — upload aparentemente ok e leitura quebrada.
    command: -scheme http -public-host 127.0.0.1:4443
    ports:
      - "4443:4443"
    volumes:
      - gcs_emulator_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8080"
    # O /health checa o banco, entao este healthcheck reflete a capacidade real
    # de servir -- nao apenas se o processo responde a socket. Sem ele, uma API
    # com o Postgres fora ficaria "healthy" para o orquestrador enquanto devolve
    # erro em toda requisicao util.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Generoso de proposito: a subida roda migracoes e bootstrap de catalogo.
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      TELEMETRY_EXCHANGE: ${TELEMETRY_EXCHANGE:-pipeline_telemetry}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      DOCUMENT_INDEX_EXCHANGE: ${DOCUMENT_INDEX_EXCHANGE:-thingindex.document.index}
      DOCUMENT_INDEX_QUEUE: ${DOCUMENT_INDEX_QUEUE:-thingindex.document.index.queue}
      DOCUMENT_INDEX_ROUTING_KEY: ${DOCUMENT_INDEX_ROUTING_KEY:-document.index.requested}
      DOCUMENT_INDEX_RETRY_QUEUE: ${DOCUMENT_INDEX_RETRY_QUEUE:-thingindex.document.index.retry}
      DOCUMENT_INDEX_DLQ: ${DOCUMENT_INDEX_DLQ:-thingindex.document.index.dlq}
      DOCUMENT_INDEX_RETRY_DELAY_SECONDS: ${DOCUMENT_INDEX_RETRY_DELAY_SECONDS:-30}
      DOCUMENT_INDEX_MAX_RETRIES: ${DOCUMENT_INDEX_MAX_RETRIES:-5}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}

  indexer:
    build:
      context: ./api
      dockerfile: Dockerfile.indexer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      DOCUMENT_INDEX_EXCHANGE: ${DOCUMENT_INDEX_EXCHANGE:-thingindex.document.index}
      DOCUMENT_INDEX_QUEUE: ${DOCUMENT_INDEX_QUEUE:-thingindex.document.index.queue}
      DOCUMENT_INDEX_ROUTING_KEY: ${DOCUMENT_INDEX_ROUTING_KEY:-document.index.requested}
      DOCUMENT_INDEX_RETRY_QUEUE: ${DOCUMENT_INDEX_RETRY_QUEUE:-thingindex.document.index.retry}
      DOCUMENT_INDEX_DLQ: ${DOCUMENT_INDEX_DLQ:-thingindex.document.index.dlq}
      DOCUMENT_INDEX_RETRY_DELAY_SECONDS: ${DOCUMENT_INDEX_RETRY_DELAY_SECONDS:-30}
      DOCUMENT_INDEX_MAX_RETRIES: ${DOCUMENT_INDEX_MAX_RETRIES:-5}
      # Prazo maximo de uma unica mensagem. O consumidor e sequencial, entao sem
      # isso um PDF gigante ou um LLM que nao responde trava a fila inteira.
      DOCUMENT_INDEX_HANDLER_TIMEOUT_SECONDS: ${DOCUMENT_INDEX_HANDLER_TIMEOUT_SECONDS:-600}
      # Documento em PROCESSING ha mais que isto e considerado abandonado por um
      # worker morto e marcado como FAILED. Precisa ser MAIOR que o prazo por
      # mensagem, senao o reaper mata trabalho legitimo (validado no boot).
      STUCK_DOCUMENT_THRESHOLD_SECONDS: ${STUCK_DOCUMENT_THRESHOLD_SECONDS:-1800}
      STUCK_DOCUMENT_POLL_INTERVAL_SECONDS: ${STUCK_DOCUMENT_POLL_INTERVAL_SECONDS:-300}
      QUEUED_DOCUMENT_REQUEUE_THRESHOLD_SECONDS: ${QUEUED_DOCUMENT_REQUEUE_THRESHOLD_SECONDS:-1800}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      # Vazio => o worker usa tesseract. Apontando para o servico ocr abaixo,
      # passa a usar o Unlimited-OCR, que tambem devolve a caixa de cada bloco.
      THINGINDEX_OCR_ENDPOINT: ${THINGINDEX_OCR_ENDPOINT:-}
      THINGINDEX_OCR_MODEL: ${THINGINDEX_OCR_MODEL:-Unlimited-OCR}
      THINGINDEX_OCR_DPI: ${THINGINDEX_OCR_DPI:-150}
      THINGINDEX_OCR_BOX_SCALE: ${THINGINDEX_OCR_BOX_SCALE:-1000}

  # Servidor do baidu/Unlimited-OCR (3B, BF16), atras da API compativel com
  # OpenAI do SGLang. Fica sob o profile `ocr` porque EXIGE GPU NVIDIA — sem ele
  # o worker continua funcionando com tesseract.
  #
  #   docker compose --profile ocr up -d ocr
  #   THINGINDEX_OCR_ENDPOINT=http://ocr:10000 docker compose up -d indexer
  #
  # Requisitos reais: 3B em BF16 ocupa ~6 GB so de pesos, entao uma GPU de 6 GB
  # nao comporta o modelo com as ativacoes. Em placa dessa faixa, sirva
  # quantizado. A primeira execucao baixa os pesos do Hugging Face.
  ocr:
    profiles: ["ocr"]
    image: lmsysorg/sglang:latest
    restart: unless-stopped
    command: >
      python3 -m sglang.launch_server
      --model baidu/Unlimited-OCR
      --served-model-name Unlimited-OCR
      --page-size 1
      --mem-fraction-static 0.8
      --context-length 32768
      --enable-custom-logit-processor
      --disable-overlap-schedule
      --host 0.0.0.0
      --port 10000
    ports:
      - "${OCR_PORT:-10000}:10000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # A porta do host e configuravel porque 3000 e a porta padrao de todo
      # projeto Next e colide na maquina de desenvolvimento -- a subida da stack
      # falhava com "Bind for 0.0.0.0:3000 failed: port is already allocated"
      # por causa de outro projeto do usuario. Mesma convencao do servico ocr.
      # Para trocar: FRONTEND_PORT=3987 ./scripts/stack.sh dev
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://api:8080/api/v1

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  huggingface_cache:
  gcs_emulator_data:
  minio_data:
  rabbitmq_data:
  frontend_node_modules:
  pgdata:
