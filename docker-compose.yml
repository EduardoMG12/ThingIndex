version: '3.8'
services:
  neo4j:
    image: neo4j:latest
    container_name: tcc-graph-db
    ports:
      - "7474:7474" 
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/minhasenha123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tcc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest