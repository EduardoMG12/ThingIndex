version: '3.8'
services:
  neo4j:
    image: neo4j:latest
    container_name: tcc-graph-db
    ports:
      - "7474:7474" 
      - "7687:7687"
    env_file:
      - .env
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tcc-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio
    container_name: tcc-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: tcc-crawler
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env
    environment:
      STORAGE_TYPE: "minio"
      RABBITMQ_URL: ${RABBITMQ_URL}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tcc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
    env_file:
      - .env

  legal-parser:
    build:
      context: ./legal-parser
      dockerfile: Dockerfile
    container_name: tcc-legal-parser
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - minio
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      PARSER_INPUT_QUEUE: "raw_documents"
      PARSER_OUTPUT_QUEUE: "parsed_documents"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
    volumes:
      - ./legal-parser/parsed_data:/app/parsed_data

  populator:
    build:
      context: ./populator
      dockerfile: Dockerfile
    container_name: tcc-populator
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - minio
      - neo4j
    env_file:
      - .env
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      POPULATOR_QUEUE: "parsed_documents"
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_AUTH: ${NEO4J_AUTH}
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"

volumes:
  minio_data:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:
