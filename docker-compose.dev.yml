services:
  api:
    image: thingindex-api-dev
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: air -c .air.toml
    volumes:
      - ./api:/app
      - ${THINGINDEX_GO_MOD_CACHE}:/go/pkg/mod
      - ${THINGINDEX_GO_BUILD_CACHE}:/root/.cache/go-build

  indexer:
    image: thingindex-indexer-dev
    build:
      context: ./api
      dockerfile: Dockerfile.indexer.dev
    command: air -c .air.indexer.toml
    volumes:
      - ./api:/app
      - ${THINGINDEX_GO_MOD_CACHE}:/go/pkg/mod
      - ${THINGINDEX_GO_BUILD_CACHE}:/root/.cache/go-build
