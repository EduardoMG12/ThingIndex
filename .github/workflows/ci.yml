name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a execucao anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # O indexador chama pdftotext e o fallback de OCR chama pdftoppm +
      # tesseract. Sem eles os testes de PDF caem em skip e passam sem testar
      # nada, que e o pior resultado possivel.
      - name: instalar poppler-utils e tesseract
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: gofmt
        working-directory: api
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "arquivos fora do gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: api
        run: go vet ./...

      # Garante que o alvo de integracao pelo menos compila. Ele nao roda aqui
      # (precisa de Postgres e MinIO), mas foi exatamente um ciclo de import que
      # deixou esse build quebrado por varios commits sem ninguem notar.
      - name: go vet (tags de integracao)
        working-directory: api
        run: go vet -tags=integration ./...

      - name: go test
        working-directory: api
        run: go test ./...

      # O artigo afirma ter "cobertura de testes automatizados" e nao havia
      # -coverprofile em lugar nenhum: nao existia percentual publicavel.
      # O piso protege contra regressao; nao e meta de perseguir 100%.
      - name: cobertura de testes
        run: bash scripts/check-coverage.sh

  # O artigo e um artefato versionado como qualquer outro, e ja quebrou em
  # silencio duas vezes: uma citacao (schymik2015benefits) existia no Overleaf e
  # nao no .bib versionado, e o Apendice A prometia arquivos DBML que nao
  # existiam no repositorio. Os dois defeitos so aparecem na compilacao final,
  # que costuma acontecer na vespera da entrega.
  artigo:
    name: artigo (citacoes e esquema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: citacoes com entrada no .bib
        run: bash scripts/check-article-citations.sh

      # O LaTeX nao trata como erro: \ref sem \label sai como '??' no PDF,
      # label duplicado faz toda referencia apontar para a ultima tabela, e
      # tabela inserida sem ser citada e defeito de escrita academica. Todos
      # sobrevivem ate a defesa se ninguem verificar.
      - name: referencias de tabela do artigo sao consistentes
        run: bash scripts/check-article-tables.sh

      # O .dbml e lido em runtime, entao o test cache do Go nao o enxerga como
      # entrada -- por isso o -count=1. Sem ele um cache quente esconderia a
      # divergencia.
      - name: DBML do Apendice A em dia com os modelos
        working-directory: api
        run: go test -count=1 ./cmd/schema-dbml/

      # As tabelas do artigo sao DERIVADAS do CSV do experimento. Rodar o
      # harness no CI garante que o numero publicado corresponde ao codigo
      # publicado -- e que o corpus nao voltou a ser circular, ja que
      # retrieval-eval aborta quando detecta circularidade.
      #
      # Este passo tambem exercita o guard de sincronia dos embeddings: o
      # harness aborta se o artefato versionado nao corresponder ao corpus
      # atual (conferencia por hash SHA-256 do texto). Sem ele, editar o corpus
      # sem regerar os vetores produziria numeros do braco denso calculados
      # sobre uma versao anterior -- sem erro, sem aviso, sem sintoma.
      - name: experimento de recuperacao roda e o corpus nao e circular
        working-directory: api
        run: go run ./cmd/retrieval-eval -out /tmp/results.csv

      # O determinismo e a afirmacao central do artigo, e a comparacao denso
      # exato (100% estavel) vs denso aproximado (0%) e a evidencia que a
      # sustenta. Rodar no CI impede que uma mudanca no IVF altere o resultado
      # publicado sem ninguem perceber.
      - name: estabilidade do ranking dos bracos densos
        working-directory: api
        run: go run ./cmd/dense-determinism

      - name: script de analise estatistica
        run: |
          python3 scripts/test_analyze.py
          python3 scripts/analyze.py /tmp/results.csv --outdir /tmp/tables --granularity document
          python3 scripts/analyze.py /tmp/results.csv --outdir /tmp/tables --granularity section

      # A TPC e a TCV sao afirmadas na Secao de Auditabilidade com valores
      # exatos (0,329 e 1,000). Os testes do comando travam essas constantes,
      # entao uma mudanca no indexador que altere a proveniencia quebra o CI em
      # vez de deixar o artigo citando um numero que nao vale mais.
      - name: metricas de auditabilidade batem com o artigo
        working-directory: api
        run: |
          go test ./cmd/provenance-eval/
          go run ./cmd/provenance-eval -tex /tmp/provenance.tex

      # A Secao de Limiar afirma que existe sinal exploravel nos scores e que o
      # corte reduz o falso positivo. Se o scorer mudar e a separabilidade
      # sumir, a conclusao do artigo deixa de valer -- o teste falha antes.
      - name: limiar de corte reduz o falso positivo
        working-directory: api
        run: |
          go test ./cmd/threshold-eval/
          go run ./cmd/threshold-eval -tex /tmp/threshold.tex

      # O artigo cita numeros do corpus (5 documentos, 19 secoes, 22 pares
      # julgados) e a mudanca de granularidade depende deles. Travar aqui
      # impede que a anotacao mude sem revisao do texto.
      - name: corpus de avaliacao bate com o artigo
        working-directory: api
        run: go test ./internal/evalcorpus/ ./cmd/retrieval-eval/

  # Os testes de integracao do repositorio validam as propriedades que o artigo
  # afirma: ordem de leitura por sequence_order, isolamento por usuario,
  # fidelidade da reconstrucao e numero fixo de consultas (sem N+1). Precisam de
  # Postgres de verdade, entao rodam em job proprio.
  #
  # Escopo proposital em ./internal/repository: os demais pacotes com tag
  # integration (processing, usecase, pkg/storage, queue, indeximport,
  # pkg/provider) tambem exigem MinIO, RabbitMQ ou chamadas reais de LLM.
  # Adicione-os aqui conforme os servicos correspondentes forem configurados.
  backend-integration:
    name: backend (integracao com postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thingindex
          POSTGRES_PASSWORD: thingindex
          POSTGRES_DB: thingindex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thingindex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: testes de integracao do repositorio
        working-directory: api
        env:
          THINGINDEX_TEST_DB_HOST: 127.0.0.1
          THINGINDEX_TEST_DB_PORT: "5432"
          THINGINDEX_TEST_DB_USER: thingindex
          THINGINDEX_TEST_DB_PASSWORD: thingindex
          THINGINDEX_TEST_DB_NAME: thingindex_test
          THINGINDEX_TEST_DB_SSLMODE: disable
        run: go test -tags=integration ./internal/repository/ -v

  frontend:
    name: frontend (next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: instalar dependencias
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: lint
        working-directory: frontend
        run: pnpm run lint

      - name: typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: testes unitarios
        working-directory: frontend
        run: pnpm run test:unit

      - name: instalar chromium do playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # A suite inteira roda aqui, sem nenhum test.fixme pendente: 14 testes,
      # todos ativos. Nenhum depende de backend — as rotas de API sao mockadas
      # com page.route, entao o que se exercita e roteamento, i18n, fluxo de UI
      # e o contrato que o frontend espera da API.
      - name: e2e (suite completa)
        working-directory: frontend
        run: pnpm exec playwright test --reporter=list
