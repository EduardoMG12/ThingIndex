[project]
name = "crawler-api"
version = "0.1.0"
description = "FastAPI proxy to RabbitMQ Crawler"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic-settings>=2.2.1",
    "pika>=1.3.2",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
