      parameters:
      - description: Items per page (max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor returned by the previous audit page
        in: query
        name: cursor
        type: string
      - description: Search over provider type, detail, origin and request correlation
        in: query
        name: q
        type: string
      - description: Provider family filter
        in: query
        name: family
        type: string
      - description: Provider type filter
        in: query
        name: provider_type
        type: string
      - description: Audit action filter
        in: query
        name: action
        type: string
      - description: Audit status filter
        in: query
        name: status
        type: string
      - description: Actor type filter
        in: query
        name: actor_type
        type: string
      - description: Actor ID filter
        in: query
        name: actor_id
        type: integer
      - description: Request correlation ID filter
        in: query
        name: correlation_id
        type: string
      - description: Inclusive start timestamp in RFC3339
        in: query
        name: created_from
        type: string
      - description: Inclusive end timestamp in RFC3339
        in: query
        name: created_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ProviderAuditQueryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Query provider audit events
      tags:
      - providers
  /user/providers/models:
    post:
      consumes:
      - application/json
      description: Tries to discover available models for the selected LLM provider,
        using live discovery and cached fallbacks when applicable.
      parameters:
