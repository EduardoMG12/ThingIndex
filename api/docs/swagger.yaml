  dto.TreeTraversalStepResponse:
    properties:
      end_page:
        type: integer
      level:
        type: integer
      node_id:
        type: string
      score:
        type: integer
      start_page:
        type: integer
      title:
        type: string
    type: object
  dto.UpdateChatConversationRequest:
    properties:
      title:
        maxLength: 255
        type: string
    required:
    - title
    type: object
  indexio.DocumentIndexExportEnvelope:
    properties:
      document_index:
        $ref: '#/definitions/dto.DocumentIndexResponse'
      exported_at:
        type: string
      kind:
        type: string
      source:
        $ref: '#/definitions/indexio.DocumentIndexExportSource'
      version:
        type: string
    type: object
  indexio.DocumentIndexExportSource:
    properties:
      document_id:
        type: integer
      document_title:
        type: string
      export_route:
        type: string
      mime_type:
        type: string
      origin:
        type: string
      product:
        type: string
      source_key:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      status:
        type: integer
      type:
        description: success, error, warning, info
        type: string
    type: object
host: localhost:8000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Open-source HTTP API for ThingIndex covering auth, document cataloging,
    provider configuration, monitoring, and grounded chat.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Thing-Index API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send a reset password link to the user's email
      parameters:
      - description: User Email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Forgot password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password and return a JWT token
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.Response'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account and return a JWT token
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success token
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register a new user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset the user's password using a reset token
      parameters:
      - description: Reset Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success message
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Invalid/Expired token
          schema:
            $ref: '#/definitions/response.Response'
      summary: Reset password
      tags:
      - auth
  /chat/conversations:
    get:
      description: List saved chat conversations for the authenticated user inside
        one collection.
      parameters:
      - description: Collection ID
        in: query
        name: collection_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ChatConversationResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List chat conversations
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: Create a persisted chat conversation scoped to one collection before
        starting the grounded response stream.
      parameters:
      - description: Conversation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateChatConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ChatConversationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create chat conversation
      tags:
      - chat
  /chat/conversations/{id}:
    delete:
      description: Delete one persisted chat conversation and its grounded message
        history.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete chat conversation
      tags:
      - chat
    get:
      description: Fetch one persisted chat conversation and the grounded messages
        already stored for it.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ChatConversationDetailResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get chat conversation
      tags:
      - chat
    patch:
      consumes:
      - application/json
      description: Rename one persisted chat conversation.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Conversation update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateChatConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ChatConversationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update chat conversation title
      tags:
      - chat
  /chat/stream:
    post:
      consumes:
      - application/json
      description: Start a grounded chat response for one persisted conversation and
        stream stage, source, delta, done, and error events over SSE.
      parameters:
      - description: Chat stream payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChatStreamRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Server-sent events stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Stream grounded chat response
      tags:
      - chat
  /documents/{id}/index:
    get:
      description: Return the persisted structural index for a document owned by the
        authenticated user, including pages, paragraphs, tables, metadata, chunks,
        outline, evaluation, and monitoring.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional retrieval query evaluated over the persisted outline
          and page summaries
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DocumentIndexResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get document index
      tags:
      - documents
  /documents/{id}/index/export:
    get:
      description: Download the versioned `document_index_export` JSON artifact for
        a document owned by the authenticated user. This artifact is consumed by the
        index import CLI.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/indexio.DocumentIndexExportEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Export document index
      tags:
      - documents
  /documents/audit:
    get:
      description: Query document audit events with operational filters, summary and
        cursor pagination.
      parameters:
      - description: Items per page (max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor returned by the previous audit page
        in: query
        name: cursor
        type: string
      - description: Search over title, detail, origin and request correlation
        in: query
        name: q
        type: string
      - description: Audit action filter
        in: query
        name: action
        type: string
      - description: Audit status filter
        in: query
        name: status
        type: string
      - description: Actor type filter
        in: query
        name: actor_type
        type: string
      - description: Actor ID filter
        in: query
        name: actor_id
        type: integer
      - description: Request correlation ID filter
        in: query
        name: correlation_id
        type: string
      - description: Document ID filter
        in: query
        name: document_id
        type: integer
      - description: Collection ID filter
        in: query
        name: collection_id
        type: integer
      - description: Inclusive start timestamp in RFC3339
        in: query
        name: created_from
        type: string
      - description: Inclusive end timestamp in RFC3339
        in: query
        name: created_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DocumentAuditQueryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Query document audit events
      tags:
      - documents
  /documents/monitoring/summary:
    get:
      description: Return the operational monitoring summary for the authenticated
        user, including queue counters, failure buckets and LLM telemetry aggregates.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DocumentMonitoringSummaryResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get aggregated document monitoring
      tags:
      - documents
  /meta/indexing-benchmark:
    get:
      description: Returns the controlled corpus, exact-match benchmark metrics, and
        interpretation guidance for the current relational indexing baseline.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.IndexingBenchmarkReportResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get indexing benchmark baseline
      tags:
      - meta
  /meta/runtime-profile:
    get:
      description: Returns the current primary use case, scope, explicit non-goals,
        and academic/reference artifacts for the main ThingIndex runtime.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RuntimeProfileResponse'
              type: object
      summary: Get runtime profile
      tags:
      - meta
  /providers/support:
    get:
      description: Returns the current support classification for provider integrations,
        including support tier, transport mode, setup hints and operational notes.
      parameters:
      - description: 'Optional provider family filter. Supported values: STORAGE,
          LLM.'
        in: query
        name: family
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ProviderSupportResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: List provider support matrix
      tags:
      - providers
  /user/prices:
    get:
      description: Return the latest synced pricing snapshot for the authenticated
